version: 2

# O Dependabot vigia as actions, o gdtoolkit e as dependencias de QA. O motor NAO entra aqui de
# proposito — a versao esta em .godot-version e muda-la exige uma ADR (0001).

updates:
  # As actions do CI. Sem isto, um `actions/checkout@v4` fica preso no dia em
  # que foi escrito e ninguem repara ate deixar de ser suportado.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - dependencias

  # O gdtoolkit, fixado em tools/requirements.txt. Um upgrade de formatador
  # reformata o projeto inteiro, por isso vem em PR separada e revista.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ferramentas"
    labels:
      - dependencias

  # QA apenas: Playwright, axe e Postgres isolado, com lockfile (ADR 0080).
  - package-ecosystem: npm
    directory: /ferramentas
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "qa"
    labels:
      - dependencias
