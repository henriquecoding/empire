name: Prepare realm resources
on:
  push:
    branches: ["codex/founded-walled-realm"]
permissions:
  contents: read
concurrency:
  group: prepare-realm-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Gerar recursos e validar o recinto
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: ./.github/actions/godot
      - name: Preparar fontes e recursos pelos geradores existentes
        run: |
          make ferramentas-python
          gdformat src/ tests/ tools/
          make importar
          make dados-gerar
          python3 tools/content_report.py
          python3 tools/inventario_arte.py
          python3 tools/check_claims.py --write
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import check_claims
          counts = check_claims.medir()
          for name, pattern, key in check_claims.AFIRMACOES:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              def counted(match):
                  value = match.group(0)
                  a, b = match.span(1)
                  return value[:a-match.start()] + str(counts[key]) + value[b-match.start():]
              text, matches = re.subn(pattern, counted, text)
              assert matches, (name, key)
              path.write_text(text, encoding="utf-8")
          PY
          if [ -f tests/recinto_fundador_test.gd.uid ]; then git add -N tests/recinto_fundador_test.gd.uid; fi
      - name: Publicar o patch gerado para a revisão
        if: always()
        run: |
          python3 - <<'PY'
          import base64, subprocess, textwrap
          patch = subprocess.check_output(["git", "diff", "--no-ext-diff", "--binary"])
          print("EMPIRE_PATCH_BEGIN")
          for line in textwrap.wrap(base64.b64encode(patch).decode("ascii"), 4000):
              print("EMPIRE_PATCH_DATA " + line)
          print("EMPIRE_PATCH_END")
          PY
      - name: Provar que a regressão falha na main anterior
        run: |
          git fetch --no-tags --depth=1 origin d087a08550050575772781a869cea371969e9ca6
          git worktree add --detach /tmp/realm-before d087a08550050575772781a869cea371969e9ca6
          cp tests/recinto_fundador_test.gd /tmp/realm-before/tests/
          godot --headless --import --path /tmp/realm-before >/dev/null 2>&1 || true
          set +e
          godot --headless --path /tmp/realm-before -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a tests/recinto_fundador_test.gd > /tmp/realm-red.log 2>&1
          RESULT=$?
          set -e
          tail -100 /tmp/realm-red.log
          test "$RESULT" -ne 0
          if grep -E 'SCRIPT ERROR|Parse Error' /tmp/realm-red.log; then exit 1; fi
      - name: Portões estáticos e recursos gerados em sincronia
        run: make portoes dados
      - name: Fundação, expansão, ferramentas, sede e abertura natural
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tests/abertura_natural_test.gd")
          s = p.read_text()
          s = s.replace('_defender_canteiro(preco)\n', '_defender_canteiro(preco)\n\tprint("EMPIRE_OPENING_WALL ", ClockService.clock.elapsed, " coins ", _saco())\n')
          s = s.replace('assert_int(_saco()).is_greater_equal(muro.next_cost() + reserva)', 'print("EMPIRE_OPENING_RESERVE ", ClockService.clock.elapsed, " coins ", _saco(), " hunt ", _no_saco_do_arqueiro, " units ", SimLoop.units.xs, " jobs ", SimLoop.units.job_ids)\n\tassert_int(_saco()).is_greater_equal(muro.next_cost() + reserva)')
          p.write_text(s)
          PY
          godot --headless --path . -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a tests/obras_com_folga_test.gd -a tests/obras_sprite_test.gd -a tests/recinto_fundador_test.gd -a tests/expansao_das_obras_test.gd -a tests/fundacao_do_reino_test.gd -a tests/banca_do_arco_test.gd -a tests/martelo_fundador_test.gd -a tests/escada_da_sede_test.gd -a tests/abertura_natural_test.gd
