name: RG-21 verificacao temporaria

on:
  push:
    branches: ["rg-21/recrutamento-e-muralha"]

permissions:
  contents: read

concurrency:
  group: rg-21-verificacao
  cancel-in-progress: true

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/godot
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: make ferramentas-python
      - run: make importar
      - name: Testes da cidade e expansao
        continue-on-error: true
        run: godot --headless --path . -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a tests/cidade_expandida_test.gd -c
      - name: Gerar recursos e formatar
        run: |
          gdformat src/ tests/
          make dados-gerar
          python3 tools/content_report.py
          python3 tools/check_claims.py --write
          python3 - <<'PY'
          import sys
          import re
          from pathlib import Path
          sys.path.insert(0, "tools")
          import check_claims
          measured = check_claims.medir()
          for file, pattern, key in check_claims.AFIRMACOES:
              path = Path(file)
              text = path.read_text(encoding="utf-8")
              text = re.sub(pattern, lambda m: m.group(0)[:m.start(1)-m.start()] + str(measured[key]) + m.group(0)[m.end(1)-m.start():], text)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Recolher ficheiros gerados
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(["git", "ls-files", "--modified", "--others", "--exclude-standard", "-z"]).decode().split("\0")
          for file in sorted(set(paths) - {""}):
              path = Path(file)
              if not (file.endswith(".gd") or file.endswith(".gd.uid") or file.startswith("data/") or file.startswith("docs/") or file == "README.md"):
                  continue
              content = path.read_bytes().decode("utf-8")
              for index in range(0, len(content), 12000):
                  print("RG21FILE " + json.dumps({"path":file, "offset":index, "length":len(content), "content":content[index:index+12000]}, ensure_ascii=False))
          PY
      - name: Fluxos da abertura
        run: godot --headless --path . -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a tests/primeira_muralha_test.gd -a tests/abertura_natural_test.gd -a tests/fundacao_do_reino_test.gd -a tests/gameplay_loop_test.gd -a tests/obras_com_folga_test.gd -a tests/expansao_das_obras_test.gd -a tests/sim_loop_test.gd -c
