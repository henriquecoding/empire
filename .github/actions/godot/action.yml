name: Godot
description: >
  Instala a versao do motor fixada em .godot-version — e so essa. Ler o ficheiro
  em vez de repetir o numero no workflow e a mesma regra do check_claims.py: um
  numero vive num sitio. Tres jobs precisam do motor; a instalacao vive aqui uma
  vez em vez de tres copias que divergem no primeiro upgrade.

inputs:
  export-templates:
    description: Instalar tambem os templates de export de Linux (pesados, so o job do export precisa)
    required: false
    default: "false"

outputs:
  version:
    description: A versao lida de .godot-version
    value: ${{ steps.fixada.outputs.version }}

runs:
  using: composite
  steps:
    - name: A versao fixada
      id: fixada
      shell: bash
      run: |
        V=$(tr -d '[:space:]' < .godot-version)
        if [ -z "$V" ]; then echo "::error file=.godot-version::esta vazio"; exit 1; fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        echo "Godot fixado em $V"

    - name: Cache do motor
      id: cache-motor
      uses: actions/cache@v4
      with:
        path: ~/.cache/godot-bin
        key: godot-motor-${{ runner.os }}-${{ steps.fixada.outputs.version }}

    - name: Descarregar o motor
      if: steps.cache-motor.outputs.cache-hit != 'true'
      shell: bash
      env:
        V: ${{ steps.fixada.outputs.version }}
      run: |
        set -euo pipefail
        F="Godot_v${V}_linux.x86_64"
        BASE=https://github.com/godotengine/godot-builds/releases/download
        mkdir -p ~/.cache/godot-bin
        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/godot.zip "$BASE/${V}/${F}.zip"
        unzip -q /tmp/godot.zip -d /tmp
        mv "/tmp/${F}" ~/.cache/godot-bin/godot
        chmod +x ~/.cache/godot-bin/godot
        rm /tmp/godot.zip

    # Corre com cache ou sem ele: sem este passo, um cache corrompido so se
    # descobre no primeiro comando de jogo, com uma mensagem que nao ajuda.
    - name: Por no PATH e confirmar
      shell: bash
      run: |
        echo "$HOME/.cache/godot-bin" >> "$GITHUB_PATH"
        "$HOME/.cache/godot-bin/godot" --version

    - name: Cache dos templates de export
      if: inputs.export-templates == 'true'
      id: cache-templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-templates-${{ runner.os }}-${{ steps.fixada.outputs.version }}

    - name: Templates de export (so os de Linux)
      if: inputs.export-templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      env:
        V: ${{ steps.fixada.outputs.version }}
      run: |
        set -euo pipefail
        BASE=https://github.com/godotengine/godot-builds/releases/download
        T="$HOME/.local/share/godot/export_templates/${V/-/.}"
        mkdir -p "$T"
        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/t.tpz \
          "$BASE/${V}/Godot_v${V}_export_templates.tpz"
        unzip -q -j -o /tmp/t.tpz \
          templates/linux_debug.x86_64 templates/linux_release.x86_64 templates/version.txt -d "$T"
        rm /tmp/t.tpz
        ls -la "$T"
